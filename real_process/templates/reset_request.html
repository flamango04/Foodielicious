<!DOCTYPE html>
<html>
<head>
  <title>Reset Password</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-yellow-100 flex items-center justify-center px-4">
  <form method="POST" class="bg-white p-6 rounded-xl shadow-md w-full max-w-md space-y-4">
    <h2 class="text-2xl font-bold">Reset Password</h2>
    <p class="text-sm text-gray-500">We'll send a 6-digit code to your email.</p>
    {% if error %}
      <p class="text-red-500 text-sm">{{ error }}</p>
    {% endif %}
    <input type="email" name="email" placeholder="your@email.com" required
           value="{{ request.form.get('email', '') }}"
           class="w-full px-4 py-2 border rounded focus:ring focus:ring-yellow-300" />
    <button type="submit" class="w-full bg-yellow-500 text-white py-2 rounded hover:bg-yellow-600 transition">Send Code</button>
  </form>
</body>
</html>
