<!DOCTYPE html>
<html>
<head>
  <title>Register - Step 1</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-blue-100 flex items-center justify-center px-4">
  <form method="POST" class="bg-white p-6 rounded-xl shadow-md w-full max-w-md space-y-4">
    <h2 class="text-2xl font-bold">Step 1: Verify Email</h2>
    <p class="text-sm text-gray-500">Supported: Gmail & Outlook</p>
    {% if error %}
      <p class="text-red-500 text-sm">{{ error }}</p>
    {% endif %}
    <input type="email" name="email" placeholder="your@email.com" required
           value="{{ request.form.get('email', '') }}"
           class="w-full px-4 py-2 border rounded focus:ring focus:ring-blue-300" />
    <button type="submit" class="w-full bg-blue-600 text-white py-2 rounded hover:bg-blue-700 transition">Send Code</button>
  </form>
</body>
</html>
