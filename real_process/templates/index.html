<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Find Recipes</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    #suggestions {
        position: absolute;
        width: 100%;
        background: white;
        border: 1px solid #ddd;
        max-height: 200px;
        overflow-y: auto;
        z-index: 1000;
        display: none;
    }
    .suggestion-item {
        padding: 10px;
        cursor: pointer;
        border-bottom: 1px solid #eee;
    }
    .suggestion-item:hover {
        background-color: #f1f1f1;
    }
    .selected-ingredient {
        display: inline-flex;
        align-items: center;
        background-color: #d1e7ff;
        color: #004085;
        padding: 5px 10px;
        margin: 5px;
        border-radius: 15px;
        font-size: 14px;
    }
    .remove-btn {
        margin-left: 8px;
        cursor: pointer;
        font-weight: bold;
    }
  </style>
</head>
<body class="bg-gray-100">
  <div class="container mx-auto p-6">
    <h1 class="text-3xl font-bold mb-6 text-center">Find Recipes & Ingredients</h1>

    <form method="POST" id="search-form" class="max-w-lg mx-auto bg-white p-6 rounded-lg shadow-md relative">
      <label for="ingredients" class="block text-gray-700">Enter ingredients:</label>
      
      <input type="text" id="ingredients" class="w-full p-2 border rounded mt-2" placeholder="Type an ingredient..." autocomplete="off">

      <div id="suggestions"></div> <!-- Suggestion Box -->
      
      <div id="selected-ingredients" class="mt-3 flex flex-wrap"></div> <!-- Selected Ingredients -->

      <input type="hidden" name="selected_ingredients" id="selected_ingredients_input"> <!-- Hidden input for form submission -->

      <button type="submit" class="mt-4 bg-blue-500 text-white px-4 py-2 rounded hover:bg-blue-600">
        Search
      </button>
    </form>
  </div>

  <script>
    document.addEventListener("DOMContentLoaded", function () {
        const inputField = document.getElementById("ingredients");
        const suggestionBox = document.getElementById("suggestions");
        const selectedContainer = document.getElementById("selected-ingredients");
        const hiddenInput = document.getElementById("selected_ingredients_input");
        const searchForm = document.getElementById("search-form");
        let selectedIngredients = [];

        inputField.addEventListener("input", function () {
            let query = inputField.value.trim();
            if (query.length < 2) {
                suggestionBox.style.display = "none";
                return;
            }

            fetch(`/autocomplete?query=${query}`)
                .then(response => response.json())
                .then(data => {
                    suggestionBox.innerHTML = "";
                    if (data.length === 0) {
                        suggestionBox.style.display = "none";
                        return;
                    }

                    suggestionBox.style.display = "block";
                    data.forEach(item => {
                        let suggestion = document.createElement("div");
                        suggestion.textContent = item;
                        suggestion.classList.add("suggestion-item");
                        suggestion.onclick = function () {
                            addIngredient(item);
                        };
                        suggestionBox.appendChild(suggestion);
                    });
                });
        });

        inputField.addEventListener("keydown", function (event) {
            if (event.key === "Enter") {
                event.preventDefault();
                let enteredValue = inputField.value.trim();

                if (enteredValue !== "") {
                    addIngredient(enteredValue);  
                } else if (selectedIngredients.length > 0) {
                    searchForm.submit();  // If empty but ingredients exist, search.
                }
            }
        });

        function addIngredient(ingredient) {
            if (!selectedIngredients.includes(ingredient)) {
                selectedIngredients.push(ingredient);
                updateSelectedIngredients();
            }
            inputField.value = "";  
            suggestionBox.style.display = "none";  
        }

        function removeIngredient(ingredient) {
            selectedIngredients = selectedIngredients.filter(item => item !== ingredient);
            updateSelectedIngredients();
        }

        function updateSelectedIngredients() {
            selectedContainer.innerHTML = "";
            selectedIngredients.forEach(ingredient => {
                let ingredientTag = document.createElement("div");
                ingredientTag.classList.add("selected-ingredient");

                let removeBtn = document.createElement("span");
                removeBtn.textContent = " ❌";
                removeBtn.classList.add("remove-btn");
                removeBtn.onclick = function () {
                    removeIngredient(ingredient);
                };

                ingredientTag.append(ingredient, removeBtn);
                selectedContainer.appendChild(ingredientTag);
            });

            hiddenInput.value = selectedIngredients.join(",");
        }
    });
  </script>
</body>
</html>
