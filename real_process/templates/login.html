<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Login</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-gradient-to-br from-blue-100 via-white to-green-100 flex items-center justify-center px-4">
  <div class="w-full max-w-md bg-white rounded-xl shadow-xl p-8">
    <h2 class="text-3xl font-bold mb-6 text-center text-gray-800">🔐 Log In</h2>

    <form method="POST" class="space-y-5">
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Username</label>
        <input name="username" type="text"
               value="{{ request.form.get('username', '') }}"
               class="w-full px-4 py-2 border rounded-lg shadow-sm focus:outline-none focus:ring-2 focus:ring-blue-300 
                      {% if error.username %}border-red-500{% endif %}" required />
        {% if error.username %}
          <p class="text-red-600 text-sm mt-1">
            {{ error.username }}
            <a href="/register" class="underline text-blue-600">Register</a>
          </p>
        {% endif %}
      </div>

      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Password</label>
        <input name="password" type="password"
               class="w-full px-4 py-2 border rounded-lg shadow-sm focus:outline-none focus:ring-2 focus:ring-blue-300 
                      {% if error.password %}border-red-500{% endif %}" required />
        {% if error.password %}
          <p class="text-red-600 text-sm mt-1">{{ error.password }}</p>
        {% endif %}
      </div>

      <button type="submit" class="w-full bg-blue-500 text-white font-semibold py-2 rounded-lg hover:bg-blue-600 transition">
        Login
      </button>
    </form>

    <p class="mt-4 text-sm text-center text-gray-600">
      Don't have an account?
      <a href="/register" class="text-blue-500 hover:underline">Register here</a>
    </p>
  </div>
</body>
</html>
