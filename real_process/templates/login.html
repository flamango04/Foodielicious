<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Login</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-gradient-to-br from-blue-100 via-white to-green-100 flex items-center justify-center px-4">
  <div class="w-full max-w-md bg-white rounded-xl shadow-xl p-8">
    <h2 class="text-3xl font-bold mb-6 text-center text-gray-800">🔐 Log In</h2>

    <form method="POST" class="space-y-5">
      <!-- Username -->
     <!-- Email -->
<div>
  <label class="block text-sm font-medium text-gray-700 mb-1">Email</label>
  <input name="email" type="email"
         value="{{ request.form.get('email', '') }}"
         class="w-full px-4 py-2 border rounded-lg shadow-sm focus:outline-none focus:ring-2 focus:ring-blue-300 
                {% if error.email %}border-red-500{% endif %}" required />
  {% if error.email %}
    <p class="text-red-600 text-sm mt-1">
      {{ error.email }}
      <a href="{{ url_for('register_email_step1') }}" class="underline text-blue-600 ml-2">Register</a>
    </p>
  {% endif %}
</div>


      <!-- Password -->
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Password</label>
        <input name="password" type="password"
               class="w-full px-4 py-2 border rounded-lg shadow-sm focus:outline-none focus:ring-2 focus:ring-blue-300 
                      {% if error.password %}border-red-500{% endif %}" required />
        {% if error.password %}
          <p class="text-red-600 text-sm mt-1">
            {{ error.password }}
            <a href="{{ url_for('reset_request') }}" class="underline text-blue-600 ml-2">Forgot password?</a>
          </p>
        {% endif %}
      </div>

      <!-- Submit Button -->
      <button type="submit" class="w-full bg-blue-500 text-white font-semibold py-2 rounded-lg hover:bg-blue-600 transition">
        Login
      </button>
    </form>

    <!-- Footer -->
    <p class="mt-4 text-sm text-center text-gray-600">
      Don't have an account?
      <a href="{{ url_for('register_email_step1') }}" class="text-blue-500 hover:underline">Register here</a>
    </p>
    <p class="mt-1 text-sm text-center">
      <a href="{{ url_for('reset_request') }}" class="text-blue-500 hover:underline">Forgot your password?</a>
    </p>
  </div>
</body>
</html>
